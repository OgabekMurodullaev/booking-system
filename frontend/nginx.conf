server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: any unmatched path serves index.html so client-side routing
        # (React Router) can take over instead of nginx 404ing on a deep link.
        try_files $uri $uri/ /index.html;
    }
}
